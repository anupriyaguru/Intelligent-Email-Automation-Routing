<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Email Automation - Demo UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 0;
            min-height: 80vh;
        }

        .email-input-section {
            background: #f8f9fa;
            padding: 30px;
            border-right: 2px solid #e0e0e0;
        }

        .visualization-section {
            padding: 30px;
            background: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .scenario-selector {
            margin-bottom: 20px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
        }

        .scenario-selector h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #666;
        }

        .agent-flow {
            position: relative;
        }

        .flow-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .agent-node {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s;
        }

        .agent-node.active {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .agent-node.completed {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .agent-node.flagged {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .agent-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .agent-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }

        .orchestrator-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .ar-icon { background: #3b82f6; }
        .ap-icon { background: #8b5cf6; }
        .treasury-icon { background: #10b981; }
        .collections-icon { background: #f59e0b; }
        .cs-icon { background: #ec4899; }

        .agent-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .agent-status {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-idle {
            background: #f3f4f6;
            color: #6b7280;
        }

        .status-processing {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-flagged {
            background: #fef3c7;
            color: #92400e;
        }

        .agent-content {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .milestone-list {
            margin-top: 10px;
        }

        .milestone {
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            margin: 6px 0;
            font-size: 13px;
            border-left: 3px solid #e0e0e0;
        }

        .milestone.achieved {
            border-left-color: #10b981;
            background: #f0fdf4;
        }

        .connector {
            width: 2px;
            height: 30px;
            background: #e0e0e0;
            margin: 0 auto;
            position: relative;
        }

        .connector.active {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            animation: flow 1s ease-in-out infinite;
        }

        @keyframes flow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f4f6;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-panel {
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-panel.review {
            background: #fffbeb;
            border-color: #f59e0b;
        }

        .result-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }

        .result-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Business Partners Inquiry Automation</h1>
            <p>Multi-Agent Orchestration System - Live Demo</p>
        </div>

        <div class="main-grid">
            <!-- Left Panel: Email Input -->
            <div class="email-input-section">
                <h2 style="margin-bottom: 20px; color: #333;">Submit Email</h2>

                <div class="scenario-selector">
                    <h3>Quick Scenarios:</h3>
                    <select id="scenarioSelect" onchange="loadScenario()" style="margin-top: 8px;">
                        <option value="">-- Select a scenario --</option>
                        <option value="ar_statement">AR: Customer Statement Request</option>
                        <option value="ap_invoice">AP: Vendor Invoice Status ($15k)</option>
                        <option value="collections">Collections: Overdue Payment</option>
                        <option value="treasury">Treasury: Payment Terms Inquiry</option>
                        <option value="cs_general">CS: General Inquiry</option>
                    </select>
                </div>

                <form id="emailForm" onsubmit="submitEmail(event)">
                    <div class="form-group">
                        <label for="senderEmail">From Email:</label>
                        <input type="email" id="senderEmail" required placeholder="sender@company.com">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input type="text" id="subject" required placeholder="Email subject">
                    </div>

                    <div class="form-group">
                        <label for="body">Email Body:</label>
                        <textarea id="body" required placeholder="Email message content..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        Process Email
                    </button>
                </form>
            </div>

            <!-- Right Panel: Agent Flow Visualization -->
            <div class="visualization-section">
                <h2 class="flow-title">Agent Communication Flow</h2>
                <div id="agentFlow" class="agent-flow">
                    <!-- Agent nodes will be inserted here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const scenarios = {
            ar_statement: {
                sender: 'john.doe@acmecorp.com',
                subject: 'Request Account Statement July 2026',
                body: 'Dear AR Team,\n\nCould you please send me our account statement for July 2026?\nWe need this for our monthly reconciliation.\n\nCustomer ID: 10001234\nCompany: ACME Corporation\n\nThank you,\nJohn Doe'
            },
            ap_invoice: {
                sender: 'vendor@supplierco.com',
                subject: 'Invoice Status Inquiry - INV-2026-12345',
                body: 'Hello AP Team,\n\nCould you please provide the status of invoice INV-2026-12345 for $15,000?\n\nWe submitted this invoice against PO-98765 on July 15th and haven\'t received payment yet.\n\nBest regards,\nSupplier Co'
            },
            collections: {
                sender: 'accounts@delinquentco.com',
                subject: 'Past Due Balance - Payment Arrangement Request',
                body: 'Dear Collections Team,\n\nWe have a past due balance of $8,500 and would like to arrange a payment plan.\n\nCould we split this into 3 monthly installments?\n\nThank you'
            },
            treasury: {
                sender: 'finance@partnerco.com',
                subject: 'Payment Terms Inquiry',
                body: 'Hello,\n\nWe are a new customer and would like to know what payment terms are available.\n\nCan we get Net 60 terms?\n\nThanks'
            },
            cs_general: {
                sender: 'contact@newcustomer.com',
                subject: 'General Product Inquiry',
                body: 'Hi,\n\nI have a question about your products and pricing.\n\nCan someone from your team contact me?\n\nThanks'
            }
        };

        function loadScenario() {
            const select = document.getElementById('scenarioSelect');
            const scenario = scenarios[select.value];
            if (scenario) {
                document.getElementById('senderEmail').value = scenario.sender;
                document.getElementById('subject').value = scenario.subject;
                document.getElementById('body').value = scenario.body;
            }
        }

        function submitEmail(event) {
            event.preventDefault();

            const sender = document.getElementById('senderEmail').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;

            // Disable submit button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            // Start the simulation
            simulateEmailProcessing(sender, subject, body);
        }

        async function simulateEmailProcessing(sender, subject, body) {
            const flowDiv = document.getElementById('agentFlow');
            flowDiv.innerHTML = '';

            // Determine routing based on subject/body keywords
            let targetAgent = 'AR';
            let requiresReview = false;

            if (subject.toLowerCase().includes('invoice') || body.toLowerCase().includes('vendor')) {
                targetAgent = 'AP';
            }
            if (body.includes('$15,000') || body.includes('$8,500')) {
                requiresReview = true;
            }
            if (subject.toLowerCase().includes('overdue') || subject.toLowerCase().includes('past due')) {
                targetAgent = 'Collections';
            }
            if (subject.toLowerCase().includes('payment terms')) {
                targetAgent = 'Treasury';
            }
            if (subject.toLowerCase().includes('product') || subject.toLowerCase().includes('general')) {
                targetAgent = 'CS';
            }

            // Step 1: Orchestrator
            await showOrchestratorProcessing(sender, subject, targetAgent);
            await sleep(1000);

            // Step 2: Sub-agent processing
            await showSubAgentProcessing(targetAgent);
            await sleep(1500);

            // Step 3: Result
            await showResult(targetAgent, requiresReview);

            // Re-enable submit button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Process Email';
        }

        async function showOrchestratorProcessing(sender, subject, targetAgent) {
            const orchestratorHTML = `
                <div class="agent-node active" id="orchestrator">
                    <div class="agent-header">
                        <div class="agent-icon orchestrator-icon">O</div>
                        <div class="agent-name">Orchestrator Agent</div>
                        <div class="agent-status status-processing">
                            <span class="spinner"></span> Processing
                        </div>
                    </div>
                    <div class="agent-content">
                        <strong>Email Received:</strong><br>
                        From: ${sender}<br>
                        Subject: ${subject}<br><br>
                        <div class="milestone-list" id="milestones"></div>
                    </div>
                </div>
            `;
            document.getElementById('agentFlow').innerHTML = orchestratorHTML;

            const milestones = [
                'M1: Email classified (intent identified)',
                'M2: Knowledge base queried',
                'M3: Business partner identified',
                `M4: Routing to ${targetAgent} Agent`
            ];

            for (let i = 0; i < milestones.length; i++) {
                await sleep(600);
                const milestoneDiv = document.getElementById('milestones');
                milestoneDiv.innerHTML += `<div class="milestone achieved">${milestones[i]}</div>`;
            }

            await sleep(500);
            document.getElementById('orchestrator').classList.remove('active');
            document.getElementById('orchestrator').classList.add('completed');
            document.getElementById('orchestrator').querySelector('.agent-status').className = 'agent-status status-completed';
            document.getElementById('orchestrator').querySelector('.agent-status').textContent = 'Completed';
        }

        async function showSubAgentProcessing(agentType) {
            const agentIcons = {
                'AR': { class: 'ar-icon', letter: 'AR', name: 'AR Agent', port: '5001' },
                'AP': { class: 'ap-icon', letter: 'AP', name: 'AP Agent', port: '5002' },
                'Treasury': { class: 'treasury-icon', letter: 'T', name: 'Treasury Agent', port: '5003' },
                'Collections': { class: 'collections-icon', letter: 'C', name: 'Collections Agent', port: '5004' },
                'CS': { class: 'cs-icon', letter: 'CS', name: 'CS Agent', port: '5005' }
            };

            const agent = agentIcons[agentType];

            const connectorHTML = '<div class="connector active"></div>';
            document.getElementById('agentFlow').innerHTML += connectorHTML;

            await sleep(300);

            const subAgentHTML = `
                <div class="agent-node active" id="subagent">
                    <div class="agent-header">
                        <div class="agent-icon ${agent.class}">${agent.letter}</div>
                        <div class="agent-name">${agent.name} (Port ${agent.port})</div>
                        <div class="agent-status status-processing">
                            <span class="spinner"></span> Processing
                        </div>
                    </div>
                    <div class="agent-content">
                        <strong>Processing via A2A Protocol</strong><br>
                        - Retrieving SAP data<br>
                        - Drafting response<br>
                        - Calculating confidence score
                    </div>
                </div>
            `;
            document.getElementById('agentFlow').innerHTML += subAgentHTML;

            await sleep(1500);

            document.getElementById('subagent').classList.remove('active');
            document.getElementById('subagent').classList.add('completed');
            document.getElementById('subagent').querySelector('.agent-status').className = 'agent-status status-completed';
            document.getElementById('subagent').querySelector('.agent-status').textContent = 'Completed';
        }

        async function showResult(agentType, requiresReview) {
            const connectorHTML = '<div class="connector"></div>';
            document.getElementById('agentFlow').innerHTML += connectorHTML;

            await sleep(300);

            // Generate mock email responses based on agent type
            const responses = {
                'AR': `Dear Customer,

Thank you for your inquiry. Your account statement for July 2026 has been generated and is attached to this email.

Current Balance: $12,450.00
Last Payment: $5,000.00 on July 15, 2026

If you have any questions, please don't hesitate to contact us.

Best regards,
AR Team`,
                'AP': `Dear Vendor,

Thank you for your inquiry regarding Invoice INV-2026-12345.

Invoice Amount: $15,000.00
Status: Pending Approval
Expected Payment Date: August 15, 2026

The invoice is currently in our approval workflow. Once approved, payment will be processed according to Net 30 terms.

Best regards,
AP Team`,
                'Treasury': `Dear Partner,

Thank you for your inquiry about payment terms.

For new customers, we offer the following standard terms:
- Net 30 days
- 2% discount for payment within 10 days

Net 60 terms are available subject to credit review and approval. Please submit your company's financial statements for evaluation.

Best regards,
Treasury Team`,
                'Collections': `Dear Customer,

Thank you for reaching out regarding your past due balance of $8,500.

We can offer a payment plan with the following terms:
- 3 monthly installments of $2,833.33
- First payment due within 7 days
- Remaining payments due on the 1st of each month

Please confirm your acceptance to proceed.

Best regards,
Collections Team`,
                'CS': `Dear Customer,

Thank you for contacting us. We've created a service ticket (TKT-2026-001) for your inquiry.

A customer service representative will contact you within 24 hours to discuss your product questions and provide detailed pricing information.

Best regards,
Customer Service Team`
            };

            if (requiresReview) {
                // Submit to CAP Review Dashboard
                const caseData = {
                    caseId: `CASE-${Date.now()}`,
                    senderEmail: document.getElementById('senderEmail').value,
                    emailSubject: document.getElementById('subject').value,
                    emailBody: document.getElementById('body').value,
                    intentCategory: agentType.toLowerCase() === 'ap' ? 'vendor_invoice_status' :
                                    agentType.toLowerCase() === 'ar' ? 'statement_request' : 'general_inquiry',
                    confidenceScore: 0.72,
                    flaggedReason: 'high_value',
                    draftResponse: responses[agentType],
                    subAgent: `email-${agentType.toLowerCase()}-agent`,
                    bpId: '10001234',
                    bpName: agentType === 'AP' ? 'Supplier Co' : 'ACME Corporation'
                };

                // Post to CAP application
                fetch('http://localhost:4004/api/review/ReviewCases', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(caseData)
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Case submitted to Review Dashboard:', data);
                    const resultHTML = `
                        <div class="result-panel review">
                            <div class="result-title">M5: Flagged for Human Review</div>
                            <div class="result-content">
                                <strong>Reason:</strong> High value amount detected (> $5,000)<br>
                                <strong>Action:</strong> Case sent to Review Dashboard (Port 4004)<br>
                                <strong>Case ID:</strong> ${caseData.caseId}<br>
                                <strong>Status:</strong> Awaiting human approval before sending response<br><br>
                                <div style="margin-top: 15px; padding: 12px; background: white; border-radius: 4px; border-left: 3px solid #f59e0b;">
                                    <strong>Draft Response (Pending Approval):</strong><br>
                                    <pre style="white-space: pre-wrap; font-family: inherit; margin-top: 8px; font-size: 13px;">${responses[agentType]}</pre>
                                </div>
                                <br>
                                <strong>M6:</strong> Case stored in knowledge base<br><br>
                                <a href="http://localhost:4004" target="_blank" style="display: inline-block; margin-top: 10px; padding: 8px 16px; background: #f59e0b; color: white; text-decoration: none; border-radius: 4px; font-weight: 600;">
                                    View in Review Dashboard →
                                </a>
                            </div>
                        </div>
                    `;
                    document.getElementById('agentFlow').innerHTML += resultHTML;
                })
                .catch(error => {
                    console.error('Error submitting to Review Dashboard:', error);
                    const resultHTML = `
                        <div class="result-panel review">
                            <div class="result-title">M5: Flagged for Human Review</div>
                            <div class="result-content">
                                <strong>Reason:</strong> High value amount detected (> $5,000)<br>
                                <strong>Action:</strong> Case flagged (Dashboard not available)<br>
                                <strong>Note:</strong> Start CAP app with <code>cd assets/email-review-dashboard-cap && npm start</code><br><br>
                                <div style="margin-top: 15px; padding: 12px; background: white; border-radius: 4px; border-left: 3px solid #f59e0b;">
                                    <strong>Draft Response (Pending Approval):</strong><br>
                                    <pre style="white-space: pre-wrap; font-family: inherit; margin-top: 8px; font-size: 13px;">${responses[agentType]}</pre>
                                </div>
                                <br>
                                <strong>M6:</strong> Case stored in knowledge base
                            </div>
                        </div>
                    `;
                    document.getElementById('agentFlow').innerHTML += resultHTML;
                });
            } else {
                const resultHTML = `
                    <div class="result-panel">
                        <div class="result-title">M5: Response Sent Automatically</div>
                        <div class="result-content">
                            <strong>Confidence:</strong> 95%<br>
                            <strong>Action:</strong> Email sent to customer<br>
                            <strong>Status:</strong> Case resolved automatically<br><br>
                            <div style="margin-top: 15px; padding: 12px; background: white; border-radius: 4px; border-left: 3px solid #10b981;">
                                <strong>Email Response Sent:</strong><br>
                                <pre style="white-space: pre-wrap; font-family: inherit; margin-top: 8px; font-size: 13px;">${responses[agentType]}</pre>
                            </div>
                            <br>
                            <strong>M6:</strong> Case stored in knowledge base
                        </div>
                    </div>
                `;
                document.getElementById('agentFlow').innerHTML += resultHTML;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize with empty state
        window.onload = function() {
            document.getElementById('agentFlow').innerHTML = `
                <div style="text-align: center; color: #999; padding: 60px 20px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">📧</div>
                    <p>Submit an email to see the agent communication flow</p>
                </div>
            `;
        };
    </script>
</body>
</html>
