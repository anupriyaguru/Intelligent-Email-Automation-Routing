apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: email-ar-agent
  version: "1.0.0"
  description: >
    Accounts Receivable Sub-Agent. Handles statements, open items, dispute cases,
    and credit memo requests. Integrates with SAP S/4HANA AR APIs via MCP tools.

type: agent

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

requires:
  - name: s4-dispute-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.s4:apiResource:intelligent-email-automation-f52b8_s4-dispute-mcp-server:v1
  - name: s4-credit-memo-mcp-server
    kind: mcp-server
    ordId: customer.mcpbuilder.s4:apiResource:intelligent-email-automation-f52b8_s4-credit-memo-mcp-server:v1
