apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: email-cs-agent
  version: "1.0.0"
  description: >
    Customer Service Sub-Agent. Handles general inquiries, complaints, policy questions,
    and unclassified requests. Searches the knowledge base FAQ and prior case history.

type: agent

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
